version: "3.9"

services:
  ai-detector-web:
    image: ai-detector-web:latest
    container_name: ai-detector-web
    restart: unless-stopped
    environment:
      WEB_PUBLIC: "1"
      WEB_PORT: "8000"
      WEB_REDIS_URL: "redis://redis:6379/0"
      WEB_MAX_UPLOAD_BYTES: "20971520"
      WEB_CACHE_TTL_SECONDS: "1800"
      WEB_TASK_RETENTION_SECONDS: "3600"
      WEB_SHUTDOWN_GRACE_SECONDS: "30"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app-net

networks:
  app-net:
    external: true
